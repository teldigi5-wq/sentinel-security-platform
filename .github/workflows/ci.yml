name: Sentinel quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Verify installed dependencies and Python syntax
        run: |
          python -m pip check
          python -m compileall -q backend/sentinel backend/tests
      - name: Run core security regression tests
        working-directory: backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Static type verification
        working-directory: frontend
        run: npm run typecheck
      - name: Production compilation
        working-directory: frontend
        run: npm run build
