name: TEMP systemd drift diagnostic
on: push
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          cat /etc/os-release | head -3
          systemd-analyze --version | head -1
          u=$(mktemp -d)/sentinel-ssh-collector.service
          sed "s#ExecStart=/opt/sentinel/venv/bin/python #ExecStart=$(command -v python3) #" deploy/linux/systemd/sentinel-ssh-collector.service > $u
          env -i PATH=/usr/bin:/bin LC_ALL=C systemd-analyze verify "$u"; echo "exit=$?"
