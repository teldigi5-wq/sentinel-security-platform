name: Sentinel quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: sentinel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Verify installed dependencies and Python syntax
        run: |
          python -m pip check
          python -m compileall -q backend/sentinel backend/tests
      - name: Run core security regression tests
        working-directory: backend
        run: python -m pytest -q
  linux-recovery-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated drill dependencies
        run: python -m pip install -e './backend[test]'
      - name: Exercise signed ingestion and recovery (fixture only)
        working-directory: backend
        run: python -m scripts.drill_linux_collector --json-out "$GITHUB_WORKSPACE/sentinel-isolated-drill.json"
      - name: Attach synthetic-only qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-isolated-linux-recovery-results
          path: sentinel-isolated-drill.json
          if-no-files-found: error
          retention-days: 7
  linux-runtime-observation-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Qualify read-only runtime probe with synthetic systemd fixtures
        working-directory: backend
        run: python -m pytest -q tests/test_host_observation.py tests/test_coverage_probe.py
      # Passing fixture tests must not be labeled host-certification evidence.
  detection-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Run independent synthetic detection regression
        working-directory: backend
        run: python -m scripts.benchmark_quality --json synthetic-benchmark-results.json
      - name: Attach test evidence (synthetic only)
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-synthetic-detection-results
          path: backend/synthetic-benchmark-results.json
          if-no-files-found: error
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Static type verification
        working-directory: frontend
        run: npm run typecheck
      - name: Production compilation
        working-directory: frontend
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_ci
          POSTGRES_USER: sentinel_ci
          POSTGRES_PASSWORD: sentinel_ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_ci -d sentinel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENTINEL_TEST_POSTGRES_URL: postgresql+psycopg://sentinel_ci:sentinel_ephemeral_ci_only@localhost:5432/sentinel_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and PostgreSQL integration dependencies
        run: python -m pip install -e './backend[postgres,test]'
      - name: Execute database migration and concurrent ingestion regression
        working-directory: backend
        run: python -m pytest -q tests/test_postgres_integration.py

  release-candidate-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared backend test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Verify single-head migration and cross-feature recovery
        working-directory: backend
        run: python -m pytest -q tests/test_release_candidate.py --junitxml="$GITHUB_WORKSPACE/sentinel-release-candidate.xml"
      - name: Retain synthetic integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-release-candidate-integration
          path: sentinel-release-candidate.xml
          if-no-files-found: warn
          retention-days: 7
