[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-security-core"
version = "0.4.0"
description = "Local-first, evidence-driven security event and detection core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3"
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
